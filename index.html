<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神大 バス時刻表 TSURU-Navi</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f9f2}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:760px;margin:auto;padding:20px 14px 48px}
.hero{background:linear-gradient(135deg,#3d7d24,#78b83f);color:white;border-radius:22px;padding:22px;margin-bottom:16px}
.eyebrow{font-size:12px;opacity:.8;letter-spacing:.08em}
.hero h1{margin:5px 0 8px;font-size:25px}
.hero p{margin:0;font-size:14px;opacity:.9}
.panel{background:white;border:1px solid #e1e8f0;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #1b35550a}
.label{font-size:13px;font-weight:700;color:#53647a;margin:0 0 9px}
select,input,button{font:inherit;border-radius:11px;border:1px solid #d3dce8;padding:12px;background:white;color:#172033;width:100%}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choice{padding:13px;text-align:left;border:1px solid #dbe4ef;background:#f9fbfe;cursor:pointer;font-weight:650}
.choice small{display:block;color:#6b7b8f;font-weight:400;margin-top:4px}
.choice.active{border:2px solid #65a83b;background:#eff8e9;padding:12px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.seg{display:flex;gap:8px}
.seg button{cursor:pointer}
.seg button.active,.primary{background:#5b9d32;color:white;border-color:#5b9d32}
.primary{font-weight:700;cursor:pointer}
.muted{color:#6b7b8f;font-size:12px}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.results-head h2{font-size:18px;margin:0}
.refresh{width:auto;padding:9px 13px;font-size:13px;cursor:pointer}
.bus{border:1px solid #e1e8f0;border-radius:15px;padding:16px;margin-top:10px}

/* 発車・到着ラベルおよび時刻を1.5倍に拡大 */
.times{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.time-label{font-size:18px;font-weight:700;color:#53647a;line-height:1.2}
.time{font-size:35px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.arrow{color:#8a9bb0;font-size:24px;font-weight:bold}

/* メタ情報・系統バッジ・行き先表示（75%＝36px） */
.busmeta{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.busmeta-header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.badge{font-size:36px;font-weight:800;border:1px solid #111;border-radius:7px;padding:3px 10px;line-height:1.1;display:inline-block}
.bus-destination{font-size:36px;font-weight:800;line-height:1.1}
.badge.r16{background:#078447;color:white}
.badge.r16d{background:white;color:#078447}
.badge.r106{background:#f6b7cf;color:#111}
.badge.r36{background:#ef8b22;color:white}

/* 二段表示：始発バッジ（系統・行先サイズの半分＝18px） */
.start-badge-container{min-height:28px;display:flex;align-items:center}
.start-badge{font-size:18px;font-weight:800;color:white;padding:4px 10px;border-radius:6px;white-space:nowrap;display:inline-block;line-height:1.2}
.start-badge.hidden{visibility:hidden} /* レイアウト崩れ防止用透明枠 */
.start-jr{background:#1769aa}
.start-hankyu{background:#7b1838}

.empty{padding:22px;text-align:center;color:#6b7b8f}
.foot{font-size:11px;color:#8491a1;text-align:center;margin-top:18px}
details{margin-top:12px}
summary{cursor:pointer;color:#52647a;font-size:13px}

@media(max-width:480px){
  .choices{grid-template-columns:1fr}
  .time{font-size:28px}
  .time-label{font-size:15px}
  .hero h1{font-size:22px}
  .badge,.bus-destination{font-size:24px}
  .start-badge{font-size:14px}
  .start-badge-container{min-height:22px}
}
</style>

<style>
#appUpdateNotice{position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;display:none;
max-width:720px;margin:auto;background:#172033;color:#fff;padding:14px 16px;border-radius:14px;
box-shadow:0 6px 24px #0004;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
#appUpdateNotice button{border:0;border-radius:9px;padding:10px 14px;background:#a8e063;color:#172033;font-weight:700;white-space:nowrap}
</style>

</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="eyebrow">KOBE UNIVERSITY BUS TIMETABLE</div>
    <h1>神大 バス時刻表 TSURU-Navi</h1>
    <p>行き先と乗車停留所を選んで、次のバスを確認</p>
  </header>

  <section class="panel">
    <p class="label">① 行き先を選択</p>
    <div class="choices" id="destinations"></div>
  </section>

  <section class="panel">
    <p class="label">② 出発停留所</p>
    <select id="origin"></select>
  </section>

  <section class="panel">
    <p class="label">③ 検索方法</p>
    <div class="seg">
      <button id="nextMode" class="active" type="button">次の5便</button>
      <button id="timeMode" type="button">時刻を指定</button>
    </div>

    <p id="todayDiaText" style="margin:10px 0 0 2px;font-size:14px;font-weight:700;color:#3d7d24"></p>

    <div id="timeBox" style="display:none;margin-top:12px;padding:12px;background:#f9fbfe;border:1px solid #dbe4ef;border-radius:12px">
      <div style="margin-bottom:12px">
        <label class="label" for="dayTypeSub" style="margin-bottom:6px;display:block">運転日ダイヤ指定</label>
        <select id="dayTypeSub">
          <option value="AUTO" selected>自動判定（今日）</option>
          <option value="WD_CLASS">月～木（授業日）</option>
          <option value="WD_OFF">月～木（休校日）</option>
          <option value="FRI_CLASS">金（授業日）</option>
          <option value="FRI_OFF">金（休校日）</option>
          <option value="HT">土日祝</option>
        </select>
      </div>
      <div>
        <label class="label" for="searchTime" style="margin-bottom:6px;display:block">指定時刻以降の便</label>
        <input id="searchTime" type="time" value="08:30">
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="results-head">
      <h2>バス一覧</h2>
      <button id="refresh" class="refresh" type="button">↻ 更新</button>
    </div>
    <div class="muted" id="status" style="margin-top:5px"></div>
    <div id="results"></div>
  </section>

  <details class="panel">
    <summary>時刻表データを更新（CSV）</summary>
    <p class="muted">新しいCSVを選択すると、この画面で使用する時刻データを差し替えます。CSVはこのアプリの列構成に対応している必要があります。</p>
    <input id="csvFile" type="file" accept=".csv,text/csv">
    <p class="muted" id="csvStatus"></p>
  </details>

  <div class="foot">時刻は登録されたCSVデータに基づきます。</div>
</main>

    render();
  });
}

function renderOrigin(){
  const d=dests.find(x=>x.name===destination);
  let valid=['JR六甲道','六甲口','阪急六甲'];
  if(!valid.includes(selectedOrigin))selectedOrigin=valid[0];
  $('origin').innerHTML=valid.map(s=>`<option ${s===selectedOrigin?'selected':''}>${s}</option>`).join('');
  $('origin').onchange=()=>{
    selectedOrigin=$('origin').value;
    render();
  };
}

function targetFor(row,d){
  const route=routeName(row['系統番号・運行区分']);
  if(d.name==='国際文化学研究科前・本部工学部前'){
    if(route==='16'||route==='106') return '神大国際文化学研究科前';
    if(route==='36') return '神大本部工学部前';
  }
  if(d.name==='国際文化学研究科前・東門'){
    if(route==='直行16') return '神大国際文化学研究科東門';
    if(route==='16'||route==='106') return '神大国際文化学研究科前';
  }
  return Array.isArray(d.target)?d.target.find(t=>minutes(row[t])!==null):d.target;
}

function eligible(row,d,origin){
  const route=routeName(row['系統番号・運行区分']);
  const target=targetFor(row,d);
  if(!d.routes.includes(route)||!target)return false;
  if(['BBBB','AAAA'].includes(row[origin])||minutes(row[origin])===null)return false;
  if(minutes(row[target])===null)return false;
  if(d.name==='国際文化学研究科前・本部工学部前') return route==='16'||route==='106'||route==='36';
  if(d.name==='国際文化学研究科前・東門') return route==='16'||route==='106'||route==='直行16';
  return route==='36'&&target===d.target;
}

// 2026年度 神戸大学学年暦

  ],

  calendarOverrides: {

    '2027-01-13': { classDay: 'MON' }
  }
};


// 日付をYYYY-MM-DD形式に変換
function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}


// 指定した日付が期間内か判定
function isInPeriods(key, periods) {
  return periods.some(([start, end]) =>
    key >= start && key <= end
  );
}


// 大学休業日の判定
function isUniversityClosed(key) {
  return isInPeriods(
    key,
    academicCalendar.universityClosedPeriods
  );
}


// 通常の授業日か判定
function isClassDay(date) {
  const day = date.getDay();
  const key = dateKey(date);

  // 土日・祝日
  if (
    day === 0 ||
    day === 6 ||
    academicCalendar.holidays.includes(key)
  ) {
    return false;
  }

  // 授業期間外
  const inPeriod = isInPeriods(
    key,
    academicCalendar.classPeriods
  );

  if (!inPeriod) return false;

  // 予備日・大学休業日
  if (
    academicCalendar.reserveDays.includes(key) ||
    isUniversityClosed(key)
  ) {
    return false;
  }

  return true;
}


// 指定された授業曜日をアプリのダイヤ区分に変換
function classDayToType(classDay) {

  if (classDay === 'OFF') {
    return 'OFF';
  }

  if (classDay === 'FRI') {
    return 'FRI_CLASS';
  }

  if (
    ['MON', 'TUE', 'WED', 'THU'].includes(classDay)
  ) {
    return 'WD_CLASS';
  }

  return null;
}


// 休みの日に適用するダイヤ区分
function getOffDayType(date) {
  const day = date.getDay();

  if (day === 5) {
    return 'FRI_OFF';
  }

  if (day === 0 || day === 6) {
    return 'HT';
  }

  return 'WD_OFF';
}


// 自動ダイヤ判定
function getTodayAutoDayType() {
  const now = new Date();
  const day = now.getDay();
  const key = dateKey(now);

  // ① 大学休業期間は最優先で休み
  if (isUniversityClosed(key)) {
    return {
      code: getOffDayType(now),
      label: '大学休業日ダイヤ'
    };
  }

  // ② 大学指定の振替日・個別指定
  const override =
    academicCalendar.calendarOverrides[key];

  if (override) {
    const type = classDayToType(override.classDay);

    if (type === 'OFF') {
      return {
        code: getOffDayType(now),
        label: '大学指定休業日ダイヤ'
      };
    }

    if (type === 'WD_CLASS') {
      return {
        code: 'WD_CLASS',
        label: '月～木（授業日）ダイヤ(変則日程)'
      };
    }

    if (type === 'FRI_CLASS') {
      return {
        code: 'FRI_CLASS',
        label: '金（授業日）ダイヤ(変則日程)'
      };
    }
  }

  // ③ 土日・祝日は休み
  if (
    day === 0 ||
    day === 6 ||
    academicCalendar.holidays.includes(key)
  ) {
    return {
      code: 'HT',
      label: '土日祝ダイヤ'
    };
  }

  // ④ 通常の授業日・休校日
  const classDay = isClassDay(now);

  if (day === 5) {
    return classDay
      ? {
          code: 'FRI_CLASS',
          label: '金曜（授業日）ダイヤ'
        }
      : {
          code: 'FRI_OFF',
          label: '金曜（休校日）ダイヤ'
        };
  }

  return classDay
    ? {
        code: 'WD_CLASS',
        label: '月～木（授業日）ダイヤ'
      }
    : {
        code: 'WD_OFF',
        label: '月～木（休校日）ダイヤ'
      };
}


// 選択中のダイヤ区分
function getActiveDayType() {
  const subVal = $('dayTypeSub')?.value || 'AUTO';

  return subVal === 'AUTO'
    ? getTodayAutoDayType().code
    : subVal;
}


// 運転日判定ロジック
function operating(row) {
  const mark = row['運転日識別記号'] || '';
  const selected = getActiveDayType();

  if (selected === 'WD_CLASS') {
    return mark === 'WD' ||
      mark === 'WD_NOT_FRI' ||
      mark === 'WD_HOL' ||
      mark === 'WD_DIRECT';
  }

  if (selected === 'WD_OFF') {
    return mark === 'WD';
  }

  if (selected === 'FRI_CLASS') {
    return mark === 'WD' ||
      mark === 'WD_FRI' ||
      mark === 'WD_HOL';
  }

  if (selected === 'FRI_OFF') {
    return mark === 'WD';
  }

  if (selected === 'HT') {
    return mark === 'HT' ||
      mark === 'SAT' ||
      mark === 'SUN' ||
      mark === 'HOL';
  }

  return false;
}
function render(){
  const d=dests.find(x=>x.name===destination);
  let now=new Date(), base=mode==='time'?minutes($('searchTime').value.replace(':','')):now.getHours()*60+now.getMinutes();
  if(base===null)base=0;
  
  let list=data.filter(r=>eligible(r,d,selectedOrigin)&&operating(r)).map(r=>{
    let target=targetFor(r,d);
    return {r,depart:minutes(r[selectedOrigin]),arrive:minutes(r[target]),target};
  }).filter(x=>x.depart>=base).sort((a,b)=>a.depart-b.depart).slice(0,5);

// 「次の5便」の時のみ「今日は（ダイヤ名）」を表示し、指定の時は非表示
  const diaEl = $('todayDiaText');
  if (diaEl) {
    if (mode === 'next') {
      const todayInfo = getTodayAutoDayType();
      diaEl.textContent = `今日は ${todayInfo.label}`;
      diaEl.style.display = 'block';
    } else {
      diaEl.style.display = 'none';
    }
  }

  $('status').textContent=(mode==='next'?'現在時刻 '+now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):hhmm(String(Math.floor(base/60)).padStart(2,'0')+String(base%60).padStart(2,'0'))+' 以降')+' · '+selectedOrigin+' 発';

  $('results').innerHTML=list.length?list.map(x=>{
    const route = routeName(x.r['系統番号・運行区分']);

    const isJR = x.r['系統番号・運行区分'].includes('JR六甲道発');

    // 始発バッジ要素（始発表示がない場合は透明のダミー枠でレイアウトずれ防止）
    let startBadgeHtml = '';

      startBadgeHtml = `<span class="start-badge start-jr">JR始発</span>`;

      startBadgeHtml = `<span class="start-badge start-hankyu">阪急始発</span>`;
    } else {
      startBadgeHtml = `<span class="start-badge hidden">始発</span>`;
    }

    return `
      <article class="bus">
        <!-- 発車・到着ラベルおよび時刻表示（1.5倍に拡大 & 動的到着停留所名） -->
        <div class="times">
          <div>
            <div class="time-label">発車</div>
            <div class="time">${hhmm(String(Math.floor(x.depart/60)).padStart(2,'0')+String(x.depart%60).padStart(2,'0'))}</div>
          </div>
          <div class="arrow">→</div>
          <div>
            <div class="time-label">${x.target}到着</div>
            <div class="time">${hhmm(String(Math.floor(x.arrive/60)).padStart(2,'0')+String(x.arrive%60).padStart(2,'0'))}</div>
          </div>
        </div>

        <!-- 系統番号・行先（75%＝36px）＆ 始発バッジ（18px・二段表示） -->
        <div class="busmeta">
          <div class="busmeta-header">
            <span class="badge ${route==='16'?'r16':route==='直行16'?'r16d':route==='106'?'r106':'r36'}">${dispRoute}</span>
            <span class="bus-destination">${x.r['行先']}行き</span>
          </div>
          <div class="start-badge-container">
            ${startBadgeHtml}
          </div>
        </div>
      </article>
    `;
  }).join(''):'<div class="empty">該当する便がありません。時刻や出発停留所を変更してください。</div>';
}

function setMode(m){
  mode=m;
  $('nextMode').classList.toggle('active',m==='next');
  $('timeMode').classList.toggle('active',m==='time');
  $('timeBox').style.display=m==='time'?'block':'none';
  render();
}

$('nextMode').onclick=()=>setMode('next');
$('timeMode').onclick=()=>setMode('time');
$('refresh').onclick=render;
$('searchTime').onchange=render;

$('csvFile').onchange=async e=>{
  let f=e.target.files[0];
  if(!f)return;
  try{
    let text=await f.text();
    let lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);
    let parseLine=line=>{
      let out=[],cur='',q=false;
      for(let i=0;i<line.length;i++){
        let c=line[i];
        if(c==='"'){
          if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q;
        }else if(c===','&&!q){out.push(cur);cur=''}else cur+=c;
      }
      out.push(cur);
      return out;
    };
    let headers=parseLine(lines[0]);
    data=lines.slice(1).filter(Boolean).map(line=>{
      let vals=parseLine(line),o={};
      headers.forEach((h,i)=>o[h]=vals[i]||'');
      return o;
    });
    $('csvStatus').textContent=`${data.length}便を読み込みました`;
    render();
  }catch(err){
    $('csvStatus').textContent='CSVを読み込めませんでした。形式を確認してください。';
  }
};

if($('dayTypeSub')) $('dayTypeSub').onchange=render;

renderDest();
renderOrigin();
render();

function scheduleMinute(){
  clearTimeout(tickTimer);
  let now=new Date(),delay=(60-now.getSeconds())*1000-now.getMilliseconds();
  tickTimer=setTimeout(()=>{
    if(mode==='next')render();
    scheduleMinute();
  },delay);
}
scheduleMinute();

<div id="appUpdateNotice" role="status" aria-live="polite"><span>新しいバージョンがあります。</span><button id="appUpdateButton" type="button">今すぐ更新</button></div>

<script>
(() => {
  if (!('serviceWorker' in navigator)) return;
  const CHECK_KEY = 'kobeBusLastUpdateCheck';
  let refreshing = false;
  let registrationRef = null;

  function showUpdateNotice() {
    const notice = document.getElementById('appUpdateNotice');
    if (notice) notice.style.display = 'flex';
  }

  function hideUpdateNotice() {
    const notice = document.getElementById('appUpdateNotice');
    if (notice) notice.style.display = 'none';
  }

  async function checkForUpdate(registration) {
    try {
      await registration.update();
      localStorage.setItem(CHECK_KEY, String(Date.now()));
    } catch (error) {
      console.info('更新確認を延期しました（通信できない場合は通常どおり利用できます）。', error);
    }
  }

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });

  window.addEventListener('load', async () => {
    try {
      registrationRef = await navigator.serviceWorker.register('./sw.js', { scope: './' });
      if (registrationRef.waiting && navigator.serviceWorker.controller) showUpdateNotice();

      registrationRef.addEventListener('updatefound', () => {
        const installing = registrationRef.installing;
        if (!installing) return;
        installing.addEventListener('statechange', () => {
          if (installing.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateNotice();
          }
        });
      });

      const lastCheck = Number(localStorage.getItem(CHECK_KEY) || 0);
      if (!lastCheck || Date.now() - lastCheck >= 24 * 60 * 60 * 1000) {
        await checkForUpdate(registrationRef);
      }
    } catch (error) {
      console.info('自動更新機能を利用できません。アプリは通常どおり利用できます。', error);
    }
  });

  document.addEventListener('click', event => {
    if (event.target && event.target.id === 'appUpdateButton' && registrationRef && registrationRef.waiting) {
      event.target.disabled = true;
      event.target.textContent = '更新中…';
      registrationRef.waiting.postMessage({ type: 'SKIP_WAITING' });
    }
  });
})();
</script>
